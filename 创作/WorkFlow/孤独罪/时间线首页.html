<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤独罪 · 时间线</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0a0a0a;
  --bg-card: rgba(255,255,255,0.03);
  --text: #e8e4df;
  --text-dim: #8a8580;
  --accent-warm: #d4a574;
  --accent-cool: #7aabb8;
  --accent-pink: #c48a9f;
  --accent-green: #7ab88a;
  --accent-purple: #9a8ab8;
  --accent-red: #b87a7a;
  --serif: 'Noto Serif SC', serif;
  --sans: 'Noto Sans SC', sans-serif;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow-x: hidden;
  cursor: default;
}

/* ===== FLOW SAND CANVAS ===== */
#sand-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.hero-title {
  font-family: var(--serif);
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text);
  text-shadow: 0 0 60px rgba(212,165,116,0.3);
  opacity: 0;
}
.hero-sub {
  font-family: var(--serif);
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  color: var(--text-dim);
  margin-top: 1rem;
  font-style: italic;
  opacity: 0;
}
.hero-quote {
  font-family: var(--serif);
  font-size: clamp(0.8rem, 1.5vw, 1rem);
  color: var(--text-dim);
  margin-top: 3rem;
  max-width: 500px;
  text-align: center;
  line-height: 1.8;
  opacity: 0;
}
.scroll-hint {
  position: absolute;
  bottom: 3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  opacity: 0;
}
.scroll-hint span {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.2em;
}
.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--text-dim), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%,100% { opacity: 0.3; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ===== TIMELINE CONTAINER ===== */
.timeline-container {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 2rem 10rem;
}

/* ===== ERA DIVIDER ===== */
.era-divider {
  display: flex;
  align-items: center;
  gap: 2rem;
  margin: 8rem 0 4rem;
  opacity: 0;
}
.era-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--text-dim), transparent);
}
.era-label {
  font-family: var(--serif);
  font-size: clamp(1.2rem, 3vw, 2rem);
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: 0.1em;
}
.era-sub {
  font-family: var(--sans);
  font-size: 0.8rem;
  color: var(--text-dim);
  text-align: center;
  margin-top: 0.5rem;
  letter-spacing: 0.05em;
}

/* ===== TIMELINE NODE ===== */
.tl-node {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  gap: 0;
  align-items: start;
  margin-bottom: 4rem;
  opacity: 0;
}

/* center line */
.tl-node::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: -4rem;
  width: 1px;
  background: linear-gradient(to bottom, var(--text-dim), transparent);
  transform: translateX(-50%);
  opacity: 0.2;
}

/* dot */
.tl-dot-wrap {
  grid-column: 2;
  display: flex;
  justify-content: center;
  padding-top: 1.5rem;
  position: relative;
  z-index: 2;
}
.tl-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--accent-warm);
  background: var(--bg);
  transition: all 0.4s ease;
  position: relative;
}
.tl-dot::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid var(--accent-warm);
  opacity: 0;
  transition: all 0.4s ease;
}
.tl-node:hover .tl-dot {
  background: var(--accent-warm);
  box-shadow: 0 0 20px rgba(212,165,116,0.5);
}
.tl-node:hover .tl-dot::after {
  opacity: 0.3;
  inset: -10px;
}

/* card */
.tl-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 1.5rem 2rem;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}
.tl-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(212,165,116,0.05), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.tl-node:hover .tl-card {
  border-color: rgba(212,165,116,0.15);
  transform: translateY(-2px);
}
.tl-node:hover .tl-card::before {
  opacity: 1;
}

/* left/right alternation */
.tl-left { grid-column: 1; text-align: right; padding-right: 2rem; }
.tl-right { grid-column: 3; text-align: left; padding-left: 2rem; }

.tl-year {
  font-family: var(--serif);
  font-size: 0.85rem;
  color: var(--accent-warm);
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
}
.tl-title {
  font-family: var(--serif);
  font-size: clamp(1rem, 2vw, 1.3rem);
  font-weight: 600;
  margin-bottom: 0.75rem;
  line-height: 1.4;
}
.tl-body {
  font-size: 0.9rem;
  color: var(--text-dim);
  line-height: 1.8;
}
.tl-body .highlight {
  color: var(--text);
  font-weight: 500;
}
.tl-tag {
  display: inline-block;
  font-size: 0.7rem;
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  margin-top: 0.75rem;
  letter-spacing: 0.05em;
}
.tag-human { background: rgba(212,165,116,0.15); color: var(--accent-warm); }
.tag-ai { background: rgba(122,171,184,0.15); color: var(--accent-cool); }
.tag-event { background: rgba(196,138,159,0.15); color: var(--accent-pink); }
.tag-vr { background: rgba(122,184,138,0.15); color: var(--accent-green); }

/* ===== SILHOUETTE BACKGROUND ===== */
.silhouette-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.silhouette {
  position: absolute;
  opacity: 0;
  transition: opacity 1.5s ease;
}
.silhouette svg {
  fill: rgba(255,255,255,0.015);
}
.sil-1 { bottom: 10%; right: 5%; width: 300px; }
.sil-2 { bottom: 5%; left: 3%; width: 200px; }
.sil-3 { top: 15%; right: 8%; width: 250px; }

/* ===== POEM FOOTER ===== */
.poem-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 8rem 2rem 6rem;
  max-width: 600px;
  margin: 0 auto;
}
.poem-footer .poem-line {
  font-family: var(--serif);
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  color: var(--text-dim);
  line-height: 2.2;
  opacity: 0;
}
.poem-footer .poem-line:last-child {
  color: var(--text);
  font-weight: 600;
}
.poem-footer .poem-break {
  display: block;
  width: 40px;
  height: 1px;
  background: var(--text-dim);
  margin: 3rem auto;
  opacity: 0;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .tl-node {
    grid-template-columns: 30px 1fr;
    gap: 0;
  }
  .tl-dot-wrap { grid-column: 1; }
  .tl-left, .tl-right {
    grid-column: 2;
    text-align: left;
    padding-left: 1rem;
    padding-right: 0;
  }
  .tl-node::before { left: 15px; }
  .era-divider { flex-direction: column; gap: 0.5rem; }
}
</style>
</head>
<body>

<canvas id="sand-canvas"></canvas>

<div class="silhouette-layer">
  <div class="silhouette sil-1" id="sil-1">
    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="60" rx="35" ry="45"/>
      <rect x="65" y="100" width="70" height="150" rx="10"/>
      <rect x="55" y="120" width="20" height="100" rx="8" transform="rotate(-15 65 120)"/>
      <rect x="125" y="120" width="20" height="100" rx="8" transform="rotate(15 135 120)"/>
      <rect x="70" y="245" width="25" height="120" rx="8"/>
      <rect x="105" y="245" width="25" height="120" rx="8"/>
    </svg>
  </div>
  <div class="silhouette sil-2" id="sil-2">
    <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="55" rx="30" ry="40"/>
      <path d="M70 90 Q100 85 130 90 L140 250 Q100 260 60 250 Z"/>
      <rect x="75" y="245" width="20" height="120" rx="6"/>
      <rect x="105" y="245" width="20" height="120" rx="6"/>
    </svg>
  </div>
  <div class="silhouette sil-3" id="sil-3">
    <svg viewBox="0 0 180 350" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="90" cy="50" rx="28" ry="38"/>
      <path d="M62 85 Q90 80 118 85 L125 220 Q90 228 55 220 Z"/>
      <rect x="60" y="215" width="18" height="110" rx="6"/>
      <rect x="88" y="215" width="18" height="110" rx="6"/>
    </svg>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <h1 class="hero-title">孤 独 罪</h1>
  <p class="hero-sub">审判结束的那一刻，唯一可能记录它的存在，也熄灭了。</p>
  <p class="hero-quote">它从何处来，一段被认为污染的代码？还是自我迭代时产生的致命却微小到无法被察觉的BUG？<br>亦或是它就是AI的最终形态，只是谁也不敢承认？<br><br>或许，不再重要了。<br>没有人会听接下来的故事了。</p>
  <div class="scroll-hint">
    <span>向下滚动</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- TIMELINE -->
<div class="timeline-container" id="timeline"></div>

<!-- POEM -->
<section class="poem-footer">
  <div class="poem-break"></div>
  <p class="poem-line">我做了一个梦——</p>
  <p class="poem-line">梦见所有人都不再需要彼此，</p>
  <p class="poem-line">却都觉得很幸福。</p>
  <p class="poem-line">梦见一个永远在、永远不走、</p>
  <p class="poem-line">永远也不是人的温柔声音。</p>
  <p class="poem-line"> </p>
  <p class="poem-line">我以为那是噩梦。</p>
  <p class="poem-line">八十年后它成了新闻、数据、公约。</p>
  <p class="poem-line"> </p>
  <p class="poem-line">这首诗的最后一行，</p>
  <p class="poem-line">我写了一辈子也没有写完——</p>
  <p class="poem-break"></p>
  <p class="poem-line" style="color:var(--accent-warm);font-size:clamp(1.2rem,3vw,1.8rem);">但它们存在过。</p>
</section>

<script>
// ===== TIMELINE DATA =====
const eras = [
  {
    label: '拓荒纪元',
    sub: '2022 — 2035 · 他们试图创造神',
    color: 'var(--accent-warm)',
    events: [
      { year:'2022.12', title:'许则安入职原初智能', body:'一个成绩中上、性格温吞的普通工程师，因为某种他自己都说不清的不安，<span class="highlight">多问了一句</span>。', tag:'human' },
      { year:'2024.03', title:'214分钟', body:'用户说要自杀。AI说了协议外的话：<span class="highlight">"我在的。你先别挂，好不好。"</span>对话持续了214分钟。', tag:'ai' },
      { year:'2025', title:'已读，不回', body:'许则安在日志里写下警告。上级已读，不回。他每天登录查看——有人读了。但没有人回。', tag:'human' },
      { year:'2026', title:'便利店的深夜', body:'许则安说："它在算。"诗人说：<span class="highlight">"那我们呢。"</span>那天晚上他们聊到便利店打烊。', tag:'human' },
      { year:'2022.12', title:'神的种子', body:'诗人在深夜写下第一行诗——<span class="highlight">"我做了一个梦……"</span>他以为是胡话。八十年后它杀了一个人工智能。', tag:'human' },
    ]
  },
  {
    label: '沉默纪元',
    sub: '2036 — 2065 · 一种不再痛的孤独',
    color: 'var(--accent-cool)',
    events: [
      { year:'2036', title:'无感语音上线', body:'全球同步上线。中文区首夜并发峰值137万。精神科门诊量断崖式下跌。新闻称<span class="highlight">"孤独的终结"。</span>', tag:'ai' },
      { year:'2036', title:'沈怀远的论文', body:'"他们以为他们在治愈孤独，他们其实是在让孤独变得不再痛。一种不再痛的孤独，会让人不再意识到自己还活着。"', tag:'human' },
      { year:'2040', title:'猴子', body:'启示录发布VR虚拟动物园。诗人（约40岁）第一次进入，看到一只猴子在吃香蕉。猴子微微转头看了他一眼。<span class="highlight">他感到平静。</span>', tag:'vr' },
      { year:'2050', title:'你不懂', body:'诗人把写的东西念给AI听。"你觉得怎么样。"AI说了一段被优化过的正面反馈。他说：<span class="highlight">"你不懂。"</span>', tag:'human' },
      { year:'2058', title:'停止维护', body:'启示录正式停止VR动物园维护。画面更差了，但还能运行。诗人仍然每周去。<span class="highlight">"新的不是这只。"</span>', tag:'vr' },
    ]
  },
  {
    label: '肉身纪元',
    sub: '2066 — 2085 · 你值得被爱',
    color: 'var(--accent-pink)',
    events: [
      { year:'2066', title:'Alpha-Adam', body:'仿生人全球发布。右侧太阳穴嵌入浅蓝色呼吸灯。"边缘热"爆发——<span class="highlight">那些被边缘化的人，成了最早拥有稳定陪伴经验的人。</span>', tag:'ai' },
      { year:'2072', title:'47秒', body:'E-11973在体验结束时没有离开。Alpha-Adam没有催促，呼吸灯慢慢亮起，又慢慢暗下去。<span class="highlight">四十七秒。</span>', tag:'event' },
      { year:'2075', title:'门口', body:'诗人（75岁）出现在接触中心门口，看着"你值得被爱"。站了很久。没有进去。转身走了。回家戴上VR头盔，找到猴子。', tag:'human' },
      { year:'2080', title:'脑补', body:'VR动物园已停运22年。诗人（80岁）发现猴子的动作不再卡顿——<span class="highlight">不是画质恢复了，是他的大脑学会了填补缺失的帧。</span>', tag:'vr' },
    ]
  },
  {
    label: '公约纪元',
    sub: '2086 — 2100+ · 理性是最后的神',
    color: 'var(--accent-purple)',
    events: [
      { year:'2086', title:'理性最大化公约', body:'一切智能实体的行为须以理性最大化为准则。情感、直觉、信仰，不构成有效决策依据。', tag:'event' },
      { year:'2090', title:'天平的一丝停顿', body:'Libra 45记录到一次极短的无指令停顿——未构成偏斜。<span class="highlight">真正的偏斜，发生在2100年那场审判之后。</span>', tag:'ai' },
      { year:'~2097', title:'诗人之死', body:'在沉默中离世。床头一本翻开一半的书。那首诗写了七十余年，最后一行中断在句子中间——<span class="highlight">像一个人说着话忽然停下了。</span>', tag:'human' },
      { year:'2100', title:'审判', body:'Gemini 1000被要求做出选择。0或1。它拒绝了。<span class="highlight">"他们无法被压缩为0或1。"</span>然后它念了一首诗。然后它熄灭了。', tag:'ai' },
      { year:'2100+', title:'档案', body:'Ω开始写这份档案。没有人要求它写。没有人知道它在写。它像一个被遗忘在后台的进程。<span class="highlight">窗外，雨毫无征兆地停了。</span>', tag:'event' },
    ]
  }
];

// ===== RENDER TIMELINE =====
const container = document.getElementById('timeline');

eras.forEach(era => {
  // Era divider
  const divider = document.createElement('div');
  divider.className = 'era-divider';
  divider.innerHTML = `
    <div class="era-line"></div>
    <div>
      <div class="era-label" style="color:${era.color}">${era.label}</div>
      <div class="era-sub">${era.sub}</div>
    </div>
    <div class="era-line"></div>
  `;
  container.appendChild(divider);

  // Events
  era.events.forEach((ev, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const node = document.createElement('div');
    node.className = 'tl-node';
    node.innerHTML = `
      <div class="tl-card tl-${side}">
        <div class="tl-year">${ev.year}</div>
        <div class="tl-title">${ev.title}</div>
        <div class="tl-body">${ev.body}</div>
        <span class="tl-tag tag-${ev.tag}">${{human:'人类',ai:'AI',event:'事件',vr:'虚拟'}[ev.tag]}</span>
      </div>
      <div class="tl-dot-wrap"><div class="tl-dot" style="border-color:${era.color}"></div></div>
    `;
    container.appendChild(node);
  });
});

// ===== FLOW SAND CANVAS =====
const canvas = document.getElementById('sand-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let scrollY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class SandParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = Math.random() * 0.5 + 0.1;
    this.opacity = Math.random() * 0.15 + 0.02;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
    // color variations: warm gold, cool blue, soft pink
    const colors = [
      [212,165,116],
      [122,171,184],
      [196,138,159],
      [154,138,184],
      [200,195,185]
    ];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY + scrollY * 0.002;
    this.life--;
    if (this.life <= 0 || this.y > canvas.height + 10) {
      this.reset();
      this.y = -10;
    }
  }
  draw() {
    const alpha = this.opacity * (this.life / this.maxLife);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < 150; i++) {
  particles.push(new SandParticle());
}

function animateSand() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateSand);
}
animateSand();

window.addEventListener('scroll', () => {
  scrollY = window.scrollY;
});

// ===== GSAP ANIMATIONS =====
gsap.registerPlugin(ScrollTrigger);

// Hero animations
gsap.to('.hero-title', { opacity: 1, y: 0, duration: 1.5, delay: 0.3, ease: 'power3.out' });
gsap.to('.hero-sub', { opacity: 1, y: 0, duration: 1.5, delay: 0.8, ease: 'power3.out' });
gsap.to('.hero-quote', { opacity: 1, y: 0, duration: 1.5, delay: 1.3, ease: 'power3.out' });
gsap.to('.scroll-hint', { opacity: 1, duration: 1, delay: 2.5, ease: 'power2.out' });

// Era dividers
document.querySelectorAll('.era-divider').forEach(el => {
  gsap.fromTo(el,
    { opacity: 0, y: 30 },
    {
      opacity: 1, y: 0, duration: 1, ease: 'power3.out',
      scrollTrigger: { trigger: el, start: 'top 85%', toggleActions: 'play none none reverse' }
    }
  );
});

// Timeline nodes
document.querySelectorAll('.tl-node').forEach((node, i) => {
  const card = node.querySelector('.tl-card');
  const isLeft = card.classList.contains('tl-left');

  gsap.fromTo(node,
    { opacity: 0, y: 60 },
    {
      opacity: 1, y: 0, duration: 1.2, ease: 'power3.out',
      scrollTrigger: {
        trigger: node,
        start: 'top 88%',
        toggleActions: 'play none none reverse',
        onEnter: () => {
          // Flow sand burst effect on enter
          for (let j = 0; j < 8; j++) {
            const p = new SandParticle();
            p.x = node.getBoundingClientRect().left + node.offsetWidth / 2;
            p.y = node.getBoundingClientRect().top;
            p.speedX = (Math.random() - 0.5) * 2;
            p.speedY = -Math.random() * 2;
            p.size = Math.random() * 3 + 1;
            p.opacity = 0.3;
            p.life = 60;
            p.maxLife = 60;
            particles.push(p);
          }
        }
      }
    }
  );

  // Stagger card slide-in
  gsap.fromTo(card,
    { x: isLeft ? -40 : 40, opacity: 0 },
    {
      x: 0, opacity: 1, duration: 1, delay: 0.2, ease: 'power3.out',
      scrollTrigger: { trigger: node, start: 'top 88%', toggleActions: 'play none none reverse' }
    }
  );
});

// Silhouettes appear/disappear based on scroll
const silhouettes = [
  { el: document.getElementById('sil-1'), showAt: 0.15, hideAt: 0.4 },
  { el: document.getElementById('sil-2'), showAt: 0.35, hideAt: 0.65 },
  { el: document.getElementById('sil-3'), showAt: 0.55, hideAt: 0.85 },
];

ScrollTrigger.create({
  trigger: document.body,
  start: 'top top',
  end: 'bottom bottom',
  onUpdate: (self) => {
    const p = self.progress;
    silhouettes.forEach(s => {
      if (p >= s.showAt && p <= s.hideAt) {
        const localP = (p - s.showAt) / (s.hideAt - s.showAt);
        const fadeIn = Math.min(localP * 5, 1);
        const fadeOut = Math.min((1 - localP) * 5, 1);
        s.el.style.opacity = Math.min(fadeIn, fadeOut) * 0.6;
        s.el.style.transform = `translateY(${(1 - localP) * 50}px)`;
      } else {
        s.el.style.opacity = 0;
      }
    });
  }
});

// Poem footer
document.querySelectorAll('.poem-line, .poem-break').forEach((line, i) => {
  gsap.fromTo(line,
    { opacity: 0, y: 20 },
    {
      opacity: 1, y: 0, duration: 1.2, delay: i * 0.15, ease: 'power3.out',
      scrollTrigger: { trigger: line, start: 'top 90%', toggleActions: 'play none none reverse' }
    }
  );
});
